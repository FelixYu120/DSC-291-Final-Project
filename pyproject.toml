[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropyield"
version = "0.1.0"
description = "DSC 291: smallholder maize-yield estimation from Sentinel-2"
requires-python = ">=3.10"
dependencies = [
  "duckdb",
  "numpy",
  "openpyxl",
  "pandas",
  "pyarrow",
  "pyproj",
  "pyshp",
  "pyyaml",
  "rasterio",
  "requests",
  "scikit-learn",
  "scipy",
  "shapely",
]

[project.optional-dependencies]
presto = ["torch>=2.5", "einops>=0.8"]
dev = ["pytest", "ruff", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cropyield.models" = ["PRESTO_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
